name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag thechef3179/auth-log-monitor:$(date +'%Y%m%d')
    
    - name: Push the Docker image
      run: docker push thechef3179/auth-log-monitor:$(date +'%Y%m%d')
